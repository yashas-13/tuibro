[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tuibro"
version = "0.1.0"
description = "TUI Embedded Browser Agent — AI-controlled browsing from your terminal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tuibro"}]
keywords = ["tui", "browser", "agent", "ai", "terminal", "playwright", "carbonyl", "ecommerce"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "playwright>=1.45.0",
    "httpx>=0.27.0",
    "carbonyl-agent>=2026.5.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
tuibro = "tuibro.cli:main"
tuibro-setup = "tuibro.cli:setup_command"

[project.urls]
Homepage = "https://github.com/tuibro/tuibro"

[tool.setuptools.packages.find]
include = ["tuibro*"]
